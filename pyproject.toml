[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cartsense-analysis"
version = "0.1.0"
description = "Backend-ready CartSense grocery basket analysis payload generator"
requires-python = ">=3.10"
dependencies = [
  "mlxtend>=0.23",
  "numpy>=1.26",
  "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["python"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]